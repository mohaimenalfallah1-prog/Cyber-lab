<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LYTOP | كل شحنتك الرقمية… في مكان واحد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ff;--card:#fff;--ink:#1b1136;--mut:#675b87;--pri:#6a3df0;--acc:#ffb020;--line:#e3dcf8;--ok:#12a150;--bad:#d33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130b27;--card:#1f1440;--ink:#f1ecff;--mut:#a99bd0;--pri:#8f6bff;--line:#352757}}
:root[data-theme="dark"]{--bg:#130b27;--card:#1f1440;--ink:#f1ecff;--mut:#a99bd0;--pri:#8f6bff;--line:#352757}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.6}
.hide{display:none!important}
button,input{font:inherit}
.logo{font-weight:800;font-size:26px;color:var(--pri);letter-spacing:1px}.logo b{color:var(--acc)}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 0,color-mix(in srgb,var(--pri) 35%,transparent),transparent 55%),var(--bg)}
.ac{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px}
.ac h1{margin:0;font-size:22px}.ac p{margin:0;color:var(--mut);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;color:var(--mut);padding:8px;border-radius:9px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--pri);color:#fff}
label{font-size:13px;color:var(--mut)}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{background:var(--acc);color:#2a1a00;border:0;font-weight:800;padding:11px;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px;display:inline-block}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* app */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;border-bottom:1px solid var(--line)}
