<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberLab — Learn. Test. Secure.</title>
<style>
:root{--bg:#0b1220;--card:#131c2f;--tx:#e8eef9;--mu:#8d9bb5;--ac:#38bdf8;--bd:#24324d;--ok:#34d399;--wn:#fbbf24;--er:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3fa;--card:#fff;--tx:#0f172a;--mu:#56657f;--ac:#0369a1;--bd:#d3dcec;--ok:#047857;--wn:#b45309;--er:#b91c1c}}
:root[data-theme="light"]{--bg:#eef3fa;--card:#fff;--tx:#0f172a;--mu:#56657f;--ac:#0369a1;--bd:#d3dcec;--ok:#047857;--wn:#b45309;--er:#b91c1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;gap:4px;padding:8px 12px;overflow-x:auto;align-items:center}
nav b{margin-inline-end:10px;font-size:18px;white-space:nowrap}
nav button{background:none;border:0;color:var(--mu);padding:6px 12px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--card);color:var(--ac);box-shadow:inset 0 -2px 0 var(--ac)}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{line-height:1.3;margin:0 0 10px}
.hero{padding:36px 0 24px}
.hero h1{font-size:clamp(34px,9vw,56px);font-family:ui-monospace,Consolas,monospace;letter-spacing:-1px;direction:ltr;text-align:right}
.hero p{font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:right;color:var(--ac);font-size:18px;margin:0 0 20px}
.btn{background:var(--ac);color:#06121f;border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer}
:root[data-theme="light"] .btn{color:#fff}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.box small{color:var(--mu);display:block}
.box strong{font-size:22px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:22px}
.ch{cursor:pointer;text-align:start;color:inherit;font:inherit}
.ch:hover{border-color:var(--ac)}
.ch .t{font-size:17px;font-weight:700}
.ch .m{color:var(--mu);font-size:13px;display:flex;justify-content:space-between;margin-top:6px}
.done{border-color:var(--ok)}
.lv{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:18px;font-weight:700}
.sec{margin:20px 0 6px;color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
input,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;font:inherit;flex:1;min-width:120px}
input,textarea,code,.out{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:14px}
textarea{width:100%;min-height:110px}
.out{background:var(--bg);border:1px dashed var(--bd);border-radius:8px;padding:10px;margin-top:8px;min-height:44px;white-space:pre-wrap;word-break:break-all}
.flag{color:var(--ok);font-weight:700;margin-top:6px}
.lab{border:1px solid var(--ac);border-radius:12px;padding:14px;background:var(--card)}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--bd);color:var(--mu)}
.bad{color:var(--er)}
.ach{display:flex;gap:12px;align-items:center;opacity:.45}
.ach.on{opacity:1;border-color:var(--wn)}
.ach span{font-size:28px}
.toast{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
.toast div{background:var(--card);border:2px solid var(--ok);border-radius:16px;padding:28px;text-align:center;max-width:340px}
.toast h2{color:var(--ok)}
.acad details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.acad summary{cursor:pointer;font-weight:700}
.acad p{margin:8px 0}
.log{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={done:{},log:[]};try{S=JSON.parse(localStorage.getItem('cl')||'null')||S}catch(e){}
const save=()=>{try{localStorage.setItem('cl',JSON.stringify(S))}catch(e){}};
const xp=()=>Object.values(S.done).reduce((a,b)=>a+b,0),cnt=()=>Object.keys(S.done).length;
const LV=[['Script Kiddie',0],['Junior Hacker',500],['Security Researcher',1500],['Red Team Pro',3000]];
const lvl=()=>LV.reduce((r,l,i)=>xp()>=l[1]?i:r,0);
const CAT=[['🟢','مبتدئ',100],['🟡','متوسط',200],['🔴','متقدم',300]];
const flagBox=f=>`<div class="flag">🚩 ${f}</div>`;
const O=h=>{$('#o').innerHTML=h};

const C=[
{id:'xss',c:0,i:'🔎',t:'اكتشاف XSS',d:'موقع متجر يعرض كلمة البحث داخل الصفحة كما هي، بدون أي تنقية.',g:'اجعل الصفحة تنفّذ كود جافاسكربت من إدخالك (المحاكاة تتعرف على الحمولة).',h:'جرّب إدخال وسم HTML مثل وسم صورة بخاصية خطأ التحميل.',f:'CL{reflected_xss_found}',
 lab(b){b.innerHTML=`<b>🛒 SecureShop</b><div class=row><input id=q placeholder="ابحث عن منتج"><button class="btn" id=go>بحث</button></div><div class=out id=o></div>`;
 $('#go').onclick=()=>{const v=$('#q').value;O('نتائج البحث عن: '+esc(v));if(/<\s*script|onerror\s*=|onload\s*=|<\s*svg|<\s*img|javascript:/i.test(v))$('#o').innerHTML+='\n⚠️ المتصفح الوهمي نفّذ الكود المحقون!'+flagBox('CL{reflected_xss_found}')}}},
{id:'login',c:0,i:'🔐',t:'ضعف تسجيل الدخول',d:'لوحة دخول لا تحدّ عدد المحاولات ويستخدم مديرها كلمة مرور شائعة.',g:'ادخل بحساب admin.',h:'كلمات المرور الأكثر شيوعًا: admin123 و 123456 و password ... لا يوجد قفل للحساب.',f:'CL{weak_password_admin}',
 lab(b){let n=0;b.innerHTML=`<b>🏢 لوحة الشركة</b><div class=row><input id=u placeholder="username"><input id=p placeholder="password"></div><button class="btn" id=go>دخول</button><div class=out id=o></div>`;
 $('#go').onclick=()=>{n++;if($('#u').value==='admin'&&$('#p').value==='admin123')O('✅ تم الدخول كمدير'+flagBox('CL{weak_password_admin}'));else O('❌ بيانات خاطئة (محاولة '+n+') — لا يوجد حظر!')}}},
{id:'priv',c:0,i:'👤',t:'مشكلة الصلاحيات',d:'التطبيق يثق بحقل role القادم من المستخدم عند حفظ الملف الشخصي.',g:'ارفع صلاحيتك إلى admin.',h:'عدّل قيمة role في الطلب قبل إرساله.',f:'CL{role_tampering}',
 lab(b){b.innerHTML=`<b>طلب تحديث الملف الشخصي</b><textarea id=t>{"user":"sara","bio":"hello","role":"user"}</textarea><button class="btn" id=go>إرسال الطلب</button><div class=out id=o></div>`;
 $('#go').onclick=()=>{try{const j=JSON.parse($('#t').value);O(j.role==='admin'?'✅ الخادم قبل الدور الجديد'+flagBox('CL{role_tampering}'):'تم الحفظ بدور: '+esc(j.role))}catch(e){O('JSON غير صالح')}}}},
{id:'sqli',c:1,i:'💉',t:'SQL Injection',d:'نموذج دخول يبني استعلام SQL بدمج المدخلات مباشرة.',g:'ادخل كمدير دون معرفة كلمة المرور.',h:'اجعل شرط الاستعلام صحيحًا دائمًا، أو علّق ما بعد اسم المستخدم.',f:'CL{sql_injection_bypass}',
 lab(b){b.innerHTML=`<b>🏦 BankPortal</b><div class=row><input id=u placeholder="username"><input id=p placeholder="password"></div><button class="btn" id=go>دخول</button><div class=out id=o></div>`;
 $('#go').onclick=()=>{const u=$('#u').value,p=$('#p').value;const q=`SELECT * FROM users WHERE name='${u}' AND pass='${p}'`;
 const hit=/'\s*or\s+'?(\w+)'?\s*=\s*'?\1/i.test(u+' '+p)||/admin'\s*(--|#)/i.test(u);
 O('الاستعلام:\n'+esc(q)+'\n\n'+(hit?'✅ الشرط صار صحيحًا — دخول كمدير'+flagBox('CL{sql_injection_bypass}'):'❌ لا يوجد مستخدم مطابق'))}}},
{id:'upload',c:1,i:'📁',t:'File Upload',d:'الخادم يمنع الملفات المنتهية بـ .php لكن فحصه حساس لحالة الأحرف.',g:'ارفع ملف سكربت يتجاوز الفحص ويعتبره الخادم قابلًا للتنفيذ.',h:'الفحص يقارن اللاحقة حرفيًا مع .php بأحرف صغيرة. هناك لواحق أخرى ينفذها الخادم أيضًا.',f:'CL{upload_filter_bypass}',
 lab(b){b.innerHTML=`<b>🖼️ رفع صورة الملف الشخصي</b><div class=row><input id=n placeholder="shell.jpg"></div><button class="btn" id=go>رفع</button><div class=out id=o></div>`;
 $('#go').onclick=()=>{const n=$('#n').value.trim();if(!n)return O('اكتب اسم ملف');if(n.endsWith('.php'))return O('🚫 ممنوع: ملفات php');
 O(/\.(php\d?|phtml)$/i.test(n)?'✅ تم الرفع، والخادم ينفّذ هذا الامتداد!'+flagBox('CL{upload_filter_bypass}'):'تم رفع '+esc(n)+' كملف عادي.')}}},
{id:'idor',c:1,i:'🔓',t:'IDOR',d:'رابط فاتورتك /invoice?id=1042 — الخادم لا يتحقق أن الفاتورة تخصك.',g:'اعثر على فاتورة مدير النظام (ليست 1042).',h:'الأرقام قريبة من 1000. المدراء غالبًا أرقامهم أصغر.',f:'CL{idor_invoice_1001}',
 lab(b){b.innerHTML=`<b>🧾 /invoice?id=</b><div class=row><input id=n type=number value=1042><button class="btn" id=go>عرض</button></div><div class=out id=o></div>`;
 $('#go').onclick=()=>{const n=+$('#n').value;if(n===1001)O('فاتورة: Administrator\nالمبلغ: 90,000\nملاحظة: '+flagBox('CL{idor_invoice_1001}'));else if(n===1042)O('فاتورة: Sara (أنت)\nالمبلغ: 120');else if(n>=1000&&n<=1050)O('فاتورة مستخدم آخر #'+n+'\nالمبلغ: '+(n*7%500));else O('غير موجودة')}}},
{id:'ssrf',c:2,i:'🌐',t:'SSRF',d:'خدمة معاينة الروابط تجلب أي عنوان تعطيه للخادم، ويوجد خدمة إدارية داخلية على نفس الجهاز.',g:'اجعل الخادم يقرأ لك صفحة /admin الداخلية.',h:'العنوان الداخلي للجهاز نفسه: localhost أو 127.0.0.1.',f:'CL{ssrf_internal_admin}',
 lab(b){b.innerHTML=`<b>🔗 معاينة رابط</b><div class=row><input id=u value="https://example.com"><button class="btn" id=go>جلب</button></div><div class=out id=o></div>`;
 $('#go').onclick=()=>{let u;try{u=new URL($('#u').value)}catch(e){return O('رابط غير صالح')}
 const local=/^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|169\.254\.169\.254)$/.test(u.hostname);
 if(!local)O('جلب '+esc(u.host)+' ... صفحة عامة عادية.');else if(u.pathname.startsWith('/admin'))O('✅ استجابة الخدمة الداخلية:\n'+flagBox('CL{ssrf_internal_admin}'));else O('خدمة داخلية! المسارات: /health  /admin')}}},
{id:'auth',c:2,i:'🔑',t:'Authentication Bypass',d:'التطبيق يقبل رمز جلسة JWT ولا يفرض التحقق من التوقيع عندما تكون الخوارزمية none.',g:'اصنع رمزًا يجعلك مديرًا.',h:'غيّر alg إلى none وقيمة admin إلى true في الحمولة.',f:'CL{jwt_alg_none}',
 lab(b){b.innerHTML=`<b>Header</b><textarea id=h style="min-height:50px">{"alg":"HS256","typ":"JWT"}</textarea><b>Payload</b><textarea id=p style="min-height:70px">{"user":"guest","admin":false}</textarea><button class="btn" id=go>طلب /admin</button><div class=out id=o></div>`;
 $('#go').onclick=()=>{try{const h=JSON.parse($('#h').value),p=JSON.parse($('#p').value);
 if(h.alg==='none'&&p.admin===true)O('✅ تجاوز التحقق من التوقيع'+flagBox('CL{jwt_alg_none}'));else if(p.admin===true)O('❌ التوقيع غير صالح');else O('403 — صلاحية مدير مطلوبة')}catch(e){O('JSON غير صالح')}}}},
{id:'chain',c:2,i:'🧩',t:'سلسلة ثغرات متعددة',d:'الخطوة ١: دليل الموظفين يعرض أي ملف بالرقم (IDOR). الخطوة ٢: لوحة الإدارة تحتاج كلمة سر.',g:'اجمع المعلومة من الدليل ثم ادخل كمدير.',h:'مدير النظام رقمه بين 1 و 10، وقد يترك ملاحظات في ملفه.',f:'CL{vuln_chain_complete}',
 lab(b){b.innerHTML=`<b>📇 الدليل /staff?id=</b><div class=row><input id=n type=number value=3><button class="btn" id=a>عرض</button></div><b>🔒 لوحة الإدارة</b><div class=row><input id=p placeholder="admin password"><button class="btn" id=go>دخول</button></div><div class=out id=o></div>`;
 $('#a').onclick=()=>{const n=+$('#n').value;O(n===7?'الاسم: Omar (Sysadmin)\nملاحظة: كلمة سر الإدارة Ch@in2024':n>=1&&n<=10?'الموظف #'+n+'\nلا توجد ملاحظات':'غير موجود')};
 $('#go').onclick=()=>O($('#p').value==='Ch@in2024'?'✅ دخلت لوحة الإدارة'+flagBox('CL{vuln_chain_complete}'):'❌ كلمة سر خاطئة')}}
];

const ACH=[['🥇','أول ثغرة',()=>cnt()>=1],['🔎','اكتشاف XSS',()=>S.done.xss],['💉','SQL Hunter',()=>S.done.sqli],['🔐','Authentication Breaker',()=>S.done.login||S.done.auth],['🛡️','5 تحديات مكتملة',()=>cnt()>=5],['👑','أنهيت كل التحديات',()=>cnt()>=C.length]];

const AC=[['🌐','Networking','افهم IP والمنافذ وTCP وDNS وHTTP. كل هجوم ويب يمر عبر هذه الطبقات.','ping example.com · traceroute · curl -I https://example.com'],
['🐧','Linux','الأوامر الأساسية والصلاحيات وملفات النظام. معظم الأدوات الأمنية تعمل على لينكس.','ls -la · chmod 640 file · grep -r "error" /var/log'],
['🕸️','Web Security','كيف يعمل الخادم والمتصفح والجلسات، ولماذا تنتج ثغرات مثل XSS وSQLi وCSRF. القاعدة: لا تثق بأي مدخل.','ثم استخدم: ترميز المخرجات، استعلامات معاملة، التحقق من الصلاحيات في الخادم'],
['🧰','Burp Suite','وسيط يعترض طلبات المتصفح لتراها وتعدلها. أداة أساسية لاختبار تطبيقات الويب المصرح بها.','Proxy ← Intercept ← Repeater'],
['📡','Nmap','يفحص الأجهزة والمنافذ والخدمات. استخدمه فقط على أجهزتك أو بتصريح كتابي.','nmap -sV 192.168.1.10'],
['📋','OWASP','قائمة OWASP Top 10 تلخص أخطر مخاطر تطبيقات الويب مثل Broken Access Control وInjection.','owasp.org/Top10'],
['🐍','أساسيات Python','لغة الأتمتة في الأمن: طلبات HTTP وتحليل السجلات وبناء أدوات صغيرة.','import requests; r=requests.get(url); print(r.status_code)']];

let V='home',cur=null;
const TABS=[['home','🏠 الرئيسية'],['ch','🎯 التحديات'],['ach','🏅 الإنجازات'],['acct','👤 حسابي'],['acad','📚 Academy']];
function go(v,id){V=v;cur=id||null;draw();scrollTo(0,0)}
function draw(){
 $('#nav').innerHTML='<b>🛡️ CyberLab</b>'+TABS.map(t=>`<button class="${(V===t[0]||(V==='lab'&&t[0]==='ch'))?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('#app').innerHTML=({home,ch,lab,ach,acct,acad})[V]();
 if(V==='lab')C.find(c=>c.id===cur).lab($('#labbox'));
}
const lvBar=()=>{const l=lvl(),n=LV[l+1],p=n?(xp()-LV[l][1])/(n[1]-LV[l][1])*100:100;return `<div class="bar"><i style="width:${p}%"></i></div><small style="color:var(--mu)">${n?(n[1]-xp())+' XP للمستوى التالي':'أعلى مستوى'}</small>`};
function home(){return `<div class="hero"><h1>🛡️ CyberLab</h1><p>Learn. Test. Secure.</p><button class="btn" onclick="go('ch')">ابدأ المختبر</button></div>
<div class="stats"><div class="box"><small>التحديات المكتملة</small><strong>${cnt()} / ${C.length}</strong></div><div class="box"><small>المستوى ${lvl()+1}</small><strong>${LV[lvl()][0]}</strong></div><div class="box"><small>النقاط</small><strong>${xp()} XP</strong></div></div>
<div class="box" style="margin-top:12px">${lvBar()}</div>
<p style="color:var(--mu);margin-top:24px">كل المختبرات هنا محاكاة آمنة داخل المتصفح. تدرّب على تحديد الثغرة وفهمها، ثم تعلّم كيف تصلحها. لا تجرّب هذه الأساليب على أنظمة لا تملكها.</p>`}
function ch(){return CAT.map((k,ci)=>`<div class="lv">${k[0]} ${k[1]} <span class="tag">${k[2]} XP</span></div><div class="grid">${C.filter(c=>c.c===ci).map(c=>`<button class="box ch ${S.done[c.id]?'done':''}" onclick="go('lab','${c.id}')"><div class="t">${c.i} ${c.t}</div><div class="m"><span>${S.done[c.id]?'✅ مكتمل':'لم يُحل'}</span><span>+${k[2]} XP</span></div></button>`).join('')}</div>`).join('')}
function lab(){const c=C.find(x=>x.id===cur);return `<button class="btn s" onclick="go('ch')">رجوع</button>
<h2 style="margin-top:14px">${c.i} ${c.t} ${S.done[c.id]?'✅':''}</h2><span class="tag">${CAT[c.c][0]} ${CAT[c.c][1]} · ${CAT[c.c][2]} XP</span>
<h3 class="sec">الوصف</h3><p>${c.d}</p><h3 class="sec">الهدف</h3><p>${c.g}</p>
<h3 class="sec">المختبر</h3><div class="lab" id="labbox"></div>
<h3 class="sec">تلميح</h3><button class="btn s" onclick="this.outerHTML='<p>💡 ${c.h}</p>'">أظهر التلميح</button>
<h3 class="sec">إرسال الحل</h3><div class="row"><input id="fl" placeholder="CL{...}"><button class="btn" onclick="submit('${c.id}')">إرسال</button></div><div id="fm"></div>`}
function submit(id){const c=C.find(x=>x.id===id),v=$('#fl').value.trim(),ok=v===c.f,t=new Date().toLocaleString('ar');
 S.log.unshift({t,n:c.t,ok});S.log=S.log.slice(0,50);
 if(ok&&!S.done[id]){const x=CAT[c.c][2],old=lvl();S.done[id]=x;save();
  const up=lvl()>old?`<p>🎉 ترقيت إلى ${LV[lvl()][0]}</p>`:'';
  const d=document.createElement('div');d.className='toast';d.innerHTML=`<div><h2>✅ Challenge Completed</h2><p style="font-size:24px;margin:6px 0">+${x} XP</p>${up}<button class="btn">متابعة</button></div>`;d.onclick=()=>{d.remove();draw()};document.body.appendChild(d);return}
 save();$('#fm').innerHTML=ok?'<p class="flag">✅ سبق أن حللت هذا التحدي</p>':'<p class="bad">❌ العلم غير صحيح. أكمل البحث في المختبر.</p>'}
function ach(){return `<h2>🏅 الإنجازات</h2>`+ACH.map(a=>{const o=!!a[2]();return `<div class="box ach ${o?'on':''}" style="margin-bottom:10px"><span>${a[0]}</span><div><b>${a[1]}</b><br><small style="color:var(--mu)">${o?'مفتوح':'مقفل'}</small></div></div>`}).join('')}
function acct(){return `<h2>👤 حسابي</h2><div class="box"><small>المستوى ${lvl()+1}</small><strong>${LV[lvl()][0]}</strong> — ${xp()} XP${lvBar()}</div>
<h3 class="sec">التحديات التي أنهيتها</h3>${cnt()?C.filter(c=>S.done[c.id]).map(c=>`<span class="tag">${c.i} ${c.t}</span> `).join(''):'<p style="color:var(--mu)">لم تنهِ أي تحدٍ بعد. ابدأ بتحدٍ مبتدئ.</p>'}
<h3 class="sec">الإنجازات (${ACH.filter(a=>a[2]()).length}/${ACH.length})</h3><p>${ACH.filter(a=>a[2]()).map(a=>a[0]+' '+a[1]).join(' · ')||'—'}</p>
<h3 class="sec">سجل المحاولات</h3>${S.log.length?S.log.slice(0,15).map(l=>`<div class="log"><span>${l.ok?'✅':'❌'} ${l.n}</span><span style="color:var(--mu)">${esc(l.t)}</span></div>`).join(''):'<p style="color:var(--mu)">لا توجد محاولات بعد.</p>'}
<div style="margin-top:20px"><button class="btn s" onclick="if(confirm('مسح كل التقدم؟')){S={done:{},log:[]};save();draw()}">إعادة ضبط التقدم</button></div>`}
function acad(){return `<div class="acad"><h2>📚 Cyber Academy</h2>`+AC.map(a=>`<details><summary>${a[0]} ${a[1]}</summary><p>${a[2]}</p><code>${esc(a[3])}</code></details>`).join('')+`</div>`}
draw();
</script>
</body>
</html>
